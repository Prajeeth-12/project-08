services:
  postgres:
    image: postgres:16
    container_name: project08-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: project08
      POSTGRES_PASSWORD: project08
      POSTGRES_DB: project08
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: